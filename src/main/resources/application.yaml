spring:
  application:
    name: core-banking

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=finflow;encrypt=true;trustServerCertificate=true;
    username: ${DB_USERNAME:SA}
    password: ${DB_PASSWORD:Password123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
    consumer:
      group-id: finflow-ai-fraud-detector
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual # Required when injecting Acknowledgment in @KafkaListener

  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: finflow-scheduler-

  ai:
    retry:
      max-attempts: 1 # Fail fast to RuleBasedFraudRiskEvaluator instead of blocking Kafka
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.1
          format: json
          keep-alive: 10m
          num-predict: 120   # Hard cap on output tokens (prevents runaway JSON generation)
          num-ctx: 2048      # Shrinks KV-cache RAM usage (default is often 4096 or 8192)
      init:
        pull-model-strategy: when_missing
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s
      imperative:
        factory: jdk

logging:
  level:
    com.ahmed.corebanking: DEBUG

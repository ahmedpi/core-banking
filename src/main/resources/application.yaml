spring:
  application:
    name: core-banking

  datasource:
    # Connect directly to our newly created finflow catalog space
    url: jdbc:sqlserver://localhost:1433;databaseName=finflow;encrypt=true;trustServerCertificate=true;
    username: SA
    password: Password123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    # Point directly to the location containing your versioned SQL migration scripts
    locations: classpath:db/migration